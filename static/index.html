<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Chatbot</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>Document Chatbot</h1>
            <button class="theme-toggle" aria-label="Toggle dark mode">
                <svg class="sun-icon" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="none" d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.454z"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="none" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
                </svg>
            </button>
        </header>
        
        <div class="upload-section">
            <h2>Upload Documents</h2>
            <form id="upload-form" class="upload-form">
                <div class="file-input-container">
                    <input type="file" id="file-input" multiple accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
                    <label for="file-input" class="file-label">
                        <span>Choose files or drag and drop</span>
                        <small>Supported: PDF, Word, Text, Images</small>
                    </label>
                </div>
                <div id="selected-files" class="selected-files"></div>
                <button type="submit" class="upload-button" disabled>Upload & Process</button>
            </form>
        </div>

        <div class="chat-container">
            <div class="chat-messages"></div>
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Ask a question about your documents...">
                <button id="send-button">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="loading" style="display: none;"></div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
